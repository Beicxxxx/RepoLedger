[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "repo-ledger"
version = "0.1.0"
description = "Git-native Entity & Knowledge Governance for AI Coding Agent Swarms"
readme = "README.md"
authors = [
    { name = "Beichen", email = "64363182+Beicxxxx@users.noreply.github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ai", "agents", "knowledge-management", "linter", "git", "governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
repo-ledger = "repo_ledger.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.flit.module]
name = "repo_ledger"

[tool.flit.sdist]
include = ["LICENSE", "docs/", "examples/", "skills/repo-ledger/", "tests/"]
exclude = ["skills/cross-harness-sync/", ".test-runs/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
